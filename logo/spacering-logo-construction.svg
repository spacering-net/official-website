<text class="lbl" x="644" y="252.08" text-anchor="end">2φu</text>
<text class="sm" x="644" y="268.08" text-anchor="end">戒身正面</text>
<path class="c" d="M771 214.72H776V247.08H771"/>
<text class="lbl" x="783" y="235.9" text-anchor="start">φu</text>
<path class="c" d="M813 234.72H818V279.44H813"/>
<text class="lbl" x="825" y="258.08" text-anchor="start">√5u</text>
<text class="sm" x="825" y="274.08" text-anchor="start">外侧曲面</text>
<text class="h" x="650" y="337.44" text-anchor="start">构造规则</text>
<text class="g" x="650" y="371.44" text-anchor="start">整体</text>
<text class="sm" x="658" y="391.44" text-anchor="start">φ = (1+√5)/2 ≈ 1.618，u = 20（512 画布）</text>
<text class="sm" x="658" y="411.44" text-anchor="start">戒面平面与画面成 30°</text>
<text class="sm" x="658" y="431.44" text-anchor="start">与戒面平行的圆周，投影为 b/a = cos30° 的椭圆</text>
<text class="sm" x="658" y="451.44" text-anchor="start">整体旋转 30°，沿短轴镜像对称</text>
<text class="g" x="650" y="475.44" text-anchor="start">戒身与月牙</text>
<text class="sm" x="658" y="495.44" text-anchor="start">O：近端戒口中心；远端戒口沿短轴前移 √5u</text>
<text class="sm" x="658" y="515.44" text-anchor="start">O′：两戒口中心的中点</text>
<text class="sm" x="658" y="535.44" text-anchor="start">外轮廓以 O′ 为心，过真实轮廓在短轴上的两端</text>
<text class="sm" x="658" y="555.44" text-anchor="start">外轮廓半长轴 A = φ⁵u；两侧较实物加厚</text>
<text class="sm" x="658" y="575.44" text-anchor="start">月牙 = 近端内沿内收 u/φ，再减去远端内沿</text>
<text class="sm" x="658" y="595.44" text-anchor="start">内收近似等距，误差小于 0.01u；外沿非同比椭圆</text>
<text class="sm" x="658" y="615.44" text-anchor="start">缝隙 + 月牙 = √5u = 外侧曲面投影宽</text>
<text class="g" x="650" y="639.44" text-anchor="start">圆点</text>
<text class="sm" x="658" y="659.44" text-anchor="start">外侧曲面上直径 2u 的正圆</text>
<text class="sm" x="658" y="679.44" text-anchor="start">该处曲面与画面成 60°，投影为 2u × u</text>
<text class="sm" x="658" y="699.44" text-anchor="start">投影椭圆 b/a = sin30°</text>
<text class="sm" x="658" y="719.44" text-anchor="start">中心在对称轴与外侧曲面中线的交点</text>
<text class="sm" x="658" y="739.44" text-anchor="start">外侧曲面中线与外轮廓同心于 O′</text>
<text class="sm" x="658" y="759.44" text-anchor="start">两侧到外侧曲面边界各留 u/φ</text>
<text class="sm" x="658" y="779.44" text-anchor="start">正面三段 φu : u : u/φ，公比 1/φ</text>
<text class="sm" x="658" y="799.44" text-anchor="start">曲面弯曲造成的轮廓偏差约 0.04u，忽略</text>
